# k8s/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: astrolearn-postgres 
spec:
  serviceName: "postgres-service" 
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:13 
        ports:
        - containerPort: 5432
          name: postgresdb
        env:
          - name: POSTGRES_DB
            value: db11
          - name: POSTGRES_USER
            value: user
          - name: POSTGRES_PASSWORD
            value: password
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        volumeMounts:
        - name: postgres-data-volume 
          mountPath: /var/lib/postgresql/data 
  volumeClaimTemplates: 
  - metadata:
      name: postgres-data-volume 
    spec:
      accessModes: [ "ReadWriteOnce" ] 
      resources:
        requests:
          storage: 1Gi 
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service 
spec:
  ports:
  - port: 5432
    name: postgresdb
  clusterIP: None 
  selector:
    app: postgres 