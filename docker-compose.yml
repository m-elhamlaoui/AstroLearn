services:

  # Next.js & React Frontend Service
  space-hub-frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: space-hub-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - space-hub-backend
    
    networks:
      - si-network

    
  # Spring Boot Backend Service (NEW)
  space-hub-backend:
    build:
      context: ./Backend/demo
      dockerfile: Dockerfile
    container_name: space-hub-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://devopsify-postgres:5432/db1
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_PORT=8088
    depends_on:
     - devopsify-postgres

    networks:
      - si-network



  devopsify-postgres:
    image: postgres:13
    container_name: si-postgres
    restart: always
    environment:
      POSTGRES_DB: db1
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - si-network


volumes:
  postgres_data:

networks:
  si-network:
    driver: bridge