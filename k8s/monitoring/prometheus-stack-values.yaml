nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# Service monitor for backend application
additionalServiceMonitors:
  - name: astrolearn-backend-monitor
    selector:
      matchLabels:
        app: astrolearn-backend
    namespaceSelector:
      matchNames:
        - default
    endpoints:
      - port: http
        path: /actuator/prometheus
        interval: 15s
