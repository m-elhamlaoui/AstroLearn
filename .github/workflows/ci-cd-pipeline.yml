name: CI/CD Pipeline

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: douaae
          password: dckr_pat_bTU5XTDbhKZE_uTO8c2W9GdR7Sc
      
      # Build and test frontend
      - name: Build Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./Frontend
          push: false
          load: true
          tags: astrolearn/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Frontend
        run: |
          docker run --rm astrolearn/frontend:${{ github.sha }} npm test -- --watchAll=false
      
      # Build and test backend
      - name: Build Backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./Backend/demo
          push: false
          load: true
          tags: astrolearn/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Backend
        run: |
          docker run --rm astrolearn/backend:${{ github.sha }} ./mvnw test
      
      # Push images to Docker Hub if on main branch or master branch
      - name: Push Frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: docker/build-push-action@v4
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/astrolearn-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/astrolearn-frontend:latest
      
      - name: Push Backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: docker/build-push-action@v4
        with:
          context: ./Backend/demo
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/astrolearn-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/astrolearn-backend:latest
  
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.0.0
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Terraform Init
        run: |
          cd Terraform
          terraform init
      
      - name: Terraform Plan
        run: |
          cd Terraform
          terraform plan -var="access_key=AKIAVRGZUA63XMDEZCAU" \
                         -var="secret_key=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" \
                         -var="region=us-east-1" \
                         -var="docker_image_frontend=douaae/astrolearn-frontend:${{ github.sha }}" \
                         -var="docker_image_backend=douaae/astrolearn-backend:${{ github.sha }}"
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/production'
        run: |
          cd Terraform
          terraform apply -auto-approve \
                         -var="access_key=AKIAVRGZUA63XMDEZCAU" \
                         -var="secret_key=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" \
                         -var="region=us-east-1" \
                         -var="docker_image_frontend=douaae/astrolearn-frontend:${{ github.sha }}" \
                         -var="docker_image_backend=douaae/astrolearn-backend:${{ github.sha }}"
