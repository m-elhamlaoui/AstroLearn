apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrolearn-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astrolearn-backend
  template:
    metadata:
      labels:
        app: astrolearn-backend
    spec:
      containers:
        - name: astrolearn-backend
          image: douaae/astrolearn-backend:latest
          ports:
            - containerPort: 8088   # ✅ The internal port your Spring Boot app listens to
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/db11
            - name: SPRING_DATASOURCE_USERNAME
              value: user
            - name: SPRING_DATASOURCE_PASSWORD
              value: password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: create
            - name: SERVER_PORT
              value: "8088"   # ✅ Spring Boot will start on port 8088
            - name: SPRING_JPA_SHOW_SQL
              value: "true"
            - name: LOGGING_LEVEL_ROOT
              value: "INFO"
            - name: LOGGING_LEVEL_COM_EXAMPLE_DEMO
              value: "DEBUG"
          resources:
            limits:
              memory: "1Gi"
              cpu: "500m"
            requests:
              memory: "512Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: astrolearn-backend-service
spec:
  selector:
    app: astrolearn-backend
  ports:
    - protocol: TCP
      port: 8088        # ✅ The port your frontend expects
      targetPort: 8088  # ✅ Must match the containerPort
  type: NodePort
