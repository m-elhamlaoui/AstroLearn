name: CI/CD Pipeline

on:
  push:
    branches: [ production ]
  pull_request:
    branches: [ production ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db5
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: douaae
          password: dckr_pat_bTU5XTDbhKZE_uTO8c2W9GdR7Sc
      
      # Build and test frontend
      - name: Build Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./Frontend
          push: false
          load: true
          tags: douaae/astrolearn-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # Skip frontend tests as they don't exist yet
      # - name: Test Frontend
      #   run: |
      #     docker run --rm douaae/astrolearn-frontend:${{ github.sha }} npm test -- --watchAll=false
      
      # Build and test backend
      - name: Build Backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./Backend/demo
          push: false
          load: true
          tags: douaae/astrolearn-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Backend
        run: |
          docker run --rm --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/db5 \
            -e SPRING_JPA_SHOW_SQL=true \
            -e LOGGING_LEVEL_ROOT=INFO \
            -e LOGGING_LEVEL_COM_EXAMPLE_DEMO=DEBUG \
            -e LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG \
            -e LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_TEST=DEBUG \
            -e SPRING_PROFILES_ACTIVE=test \
            douaae/astrolearn-backend:${{ github.sha }} \
            ./mvnw test -Dtest="com.example.demo.service.**.*Test" -DfailIfNoTests=true -Dsurefire.useFile=false --fail-at-end -Dorg.slf4j.simpleLogger.defaultLogLevel=info
      
      # Push images to Docker Hub if on main branch or master branch
      - name: Push Frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: docker/build-push-action@v4
        with:
          context: ./Frontend
          push: true
          tags: |
            douaae/astrolearn-frontend:${{ github.sha }}
            douaae/astrolearn-frontend:latest
      
      - name: Push Backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        uses: docker/build-push-action@v4
        with:
          context: ./Backend/demo
          push: true
          tags: |
            douaae/astrolearn-backend:${{ github.sha }}
            douaae/astrolearn-backend:latest
  
  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.0.0
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: AKIAVRGZUA63XMDEZCAU
          aws-secret-access-key: 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
          aws-region: us-east-1
      
      - name: Terraform Init
        run: |
          cd Terraform
          terraform init
      
      - name: Terraform Plan
        run: |
          cd Terraform
          terraform plan -var="access_key=AKIAVRGZUA63XMDEZCAU" \
                         -var="secret_key=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" \
                         -var="region=us-east-1" \
                         -var="docker_image_frontend=douaae/astrolearn-frontend:${{ github.sha }}" \
                         -var="docker_image_backend=douaae/astrolearn-backend:${{ github.sha }}"
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/production'
        run: |
          cd Terraform
          terraform apply -auto-approve \
                         -var="access_key=AKIAVRGZUA63XMDEZCAU" \
                         -var="secret_key=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" \
                         -var="region=us-east-1" \
                         -var="docker_image_frontend=douaae/astrolearn-frontend:${{ github.sha }}" \
                         -var="docker_image_backend=douaae/astrolearn-backend:${{ github.sha }}"
      
      - name: Run Database Migrations
        if: github.ref == 'refs/heads/production'
        run: |
          # Get RDS endpoint from Terraform output
          cd Terraform
          DB_ENDPOINT=$(terraform output -raw rds_endpoint)
          
          # Run migrations using the backend Docker image
          docker run --rm \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME} \
            -e SPRING_DATASOURCE_USERNAME=${DB_USERNAME} \
            -e SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD} \
            douaae/astrolearn-backend:${{ github.sha }} \
            ./mvnw flyway:migrate
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
