# Prometheus Stack Values Configuration

# Prometheus configuration
prometheus:
  prometheusSpec:
    retention: 10d
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    # Custom scrape configs - only for backend
    additionalScrapeConfigs:
      - job_name: 'astrolearn-backend'
        static_configs:
          - targets: ['astrolearn-backend-service.default.svc.cluster.local:8088']
        metrics_path: '/actuator/prometheus'

# Grafana configuration
grafana:
  adminPassword: admin
  persistence:
    enabled: false # Disable persistence to avoid permission issues
  plugins:
    - grafana-clock-panel
    - grafana-simple-json-datasource
  
